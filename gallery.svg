<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-label="مطبخ مفصل بجزيرة رخام وأدراج بمسارات هيدروليك">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39303E"/>
      <stop offset="1" stop-color="#4C4152"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B07C51"/>
      <stop offset="1" stop-color="#7C5234"/>
    </linearGradient>
    <linearGradient id="marble" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E7E2DA"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E5E52"/>
      <stop offset="1" stop-color="#554840"/>
    </linearGradient>
  </defs>
  <rect width="600" height="420" fill="url(#wall)"/>
  <rect y="340" width="600" height="80" fill="url(#floor)"/>

  <!-- Tall wall units -->
  <g stroke="#5E3F27" stroke-width="1.5">
    <rect x="30" y="40" width="540" height="200" fill="url(#wood)"/>
    <rect x="40" y="50" width="120" height="180" fill="none"/>
    <rect x="170" y="50" width="120" height="80" fill="none"/>
    <rect x="310" y="50" width="120" height="80" fill="none"/>
    <rect x="440" y="50" width="120" height="180" fill="none"/>
  </g>
  <rect x="170" y="140" width="260" height="90" fill="#F2EEE8"/>
  <path d="M190 160c40 10 70-6 110 4s60 10 110 0M200 210c50-8 90 6 200-4" stroke="#D5CEC4" stroke-width="1.5" fill="none"/>
  <rect x="170" y="130" width="260" height="4" fill="#FFE8B0"/>
  <g fill="#E8D9BF">
    <rect x="146" y="120" width="4" height="40" rx="2"/>
    <rect x="450" y="120" width="4" height="40" rx="2"/>
  </g>

  <!-- Island -->
  <rect x="110" y="262" width="380" height="18" rx="3" fill="url(#marble)" stroke="#D2CBC0"/>
  <path d="M140 270c40-4 80 6 120 0s80-6 120 2 60 0 90-2" stroke="#CFC7BB" stroke-width="1.2" fill="none"/>
  <rect x="124" y="280" width="352" height="74" fill="url(#wood)" stroke="#5E3F27" stroke-width="1.5"/>
  <g stroke="#5E3F27" stroke-width="1.3" fill="none">
    <rect x="132" y="288" width="104" height="28"/>
    <rect x="132" y="320" width="104" height="28"/>
    <rect x="248" y="288" width="104" height="60"/>
    <rect x="364" y="288" width="104" height="60"/>
  </g>
  <g fill="#E8D9BF">
    <rect x="164" y="300" width="40" height="4" rx="2"/>
    <rect x="164" y="332" width="40" height="4" rx="2"/>
    <rect x="280" y="300" width="40" height="4" rx="2"/>
    <rect x="396" y="300" width="40" height="4" rx="2"/>
  </g>

  <!-- Open drawer showing runner -->
  <g>
    <path d="M132 320h104l18 16H150z" fill="#8A5C3A" opacity="0.5"/>
  </g>

  <!-- Pendants -->
  <g fill="#C99A66">
    <line x1="220" y1="0" x2="220" y2="200" stroke="#C99A66" stroke-width="1.5"/>
    <circle cx="220" cy="208" r="10"/>
    <line x1="300" y1="0" x2="300" y2="200" stroke="#C99A66" stroke-width="1.5"/>
    <circle cx="300" cy="208" r="10"/>
    <line x1="380" y1="0" x2="380" y2="200" stroke="#C99A66" stroke-width="1.5"/>
    <circle cx="380" cy="208" r="10"/>
  </g>
</svg>
