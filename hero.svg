<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-label="مطبخ حديث بخزائن خشبية وسطح رخام">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3ECDF"/>
      <stop offset="1" stop-color="#E6DAC6"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9744A"/>
      <stop offset="1" stop-color="#7C5234"/>
    </linearGradient>
    <linearGradient id="woodUp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF7EE"/>
      <stop offset="1" stop-color="#E9DFCD"/>
    </linearGradient>
    <linearGradient id="marble" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#F1EEE9"/>
      <stop offset="1" stop-color="#E4DFD7"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CDBBA0"/>
      <stop offset="1" stop-color="#B7A283"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B9BEC2"/>
      <stop offset="0.5" stop-color="#E4E7E9"/>
      <stop offset="1" stop-color="#A8AEB3"/>
    </linearGradient>
    <pattern id="tiles" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect width="40" height="20" fill="#EFE9DE"/>
      <path d="M0 0H40M0 10H40M0 20H40M20 0V10M0 10V20M40 10V20" stroke="#DCD2C1" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="500" fill="url(#wall)"/>
  <rect x="0" y="420" width="640" height="80" fill="url(#floor)"/>
  <path d="M0 420H640" stroke="#A89274" stroke-width="2"/>

  <!-- Backsplash -->
  <rect x="40" y="190" width="560" height="96" fill="url(#tiles)"/>

  <!-- Upper cabinets -->
  <g>
    <rect x="40" y="46" width="200" height="130" rx="4" fill="url(#woodUp)" stroke="#CDBFA7"/>
    <line x1="140" y1="50" x2="140" y2="172" stroke="#CDBFA7"/>
    <rect x="124" y="120" width="4" height="36" rx="2" fill="#6E4A2E"/>
    <rect x="152" y="120" width="4" height="36" rx="2" fill="#6E4A2E"/>

    <rect x="400" y="46" width="200" height="130" rx="4" fill="url(#woodUp)" stroke="#CDBFA7"/>
    <line x1="500" y1="50" x2="500" y2="172" stroke="#CDBFA7"/>
    <rect x="484" y="120" width="4" height="36" rx="2" fill="#6E4A2E"/>
    <rect x="512" y="120" width="4" height="36" rx="2" fill="#6E4A2E"/>
  </g>

  <!-- Range hood -->
  <path d="M290 46h60v70l40 44H250l40-44z" fill="url(#steel)" stroke="#9AA0A5"/>
  <rect x="250" y="158" width="140" height="8" fill="#9AA0A5"/>

  <!-- LED strip under cabinets -->
  <rect x="44" y="176" width="192" height="3" fill="#FFE8B0"/>
  <rect x="404" y="176" width="192" height="3" fill="#FFE8B0"/>
  <path d="M44 179h192l-10 40H54z M404 179h192l-10 40H414z" fill="#FFF3D1" opacity="0.35"/>

  <!-- Countertop -->
  <rect x="30" y="286" width="580" height="16" rx="3" fill="url(#marble)" stroke="#D2CBC0"/>
  <path d="M80 292c40-4 70 6 110 0M300 294c30-5 60 4 100-2M470 291c30 3 60-3 100 2" stroke="#CFC7BB" stroke-width="1.2" fill="none"/>

  <!-- Cooktop -->
  <rect x="262" y="280" width="116" height="7" rx="2" fill="#2E2620"/>

  <!-- Sink + faucet -->
  <rect x="452" y="282" width="92" height="6" rx="3" fill="#B9BEC2"/>
  <path d="M498 282v-36a16 16 0 0 1 32 0" stroke="#9AA0A5" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Lower cabinets -->
  <g>
    <rect x="40" y="302" width="560" height="118" fill="url(#wood)"/>
    <g stroke="#5E3F27" stroke-width="1.5" fill="none">
      <rect x="48" y="310" width="100" height="102" rx="3"/>
      <rect x="156" y="310" width="100" height="48" rx="3"/>
      <rect x="156" y="364" width="100" height="48" rx="3"/>
      <rect x="264" y="310" width="112" height="102" rx="3"/>
      <rect x="384" y="310" width="100" height="102" rx="3"/>
      <rect x="492" y="310" width="100" height="102" rx="3"/>
    </g>
    <g fill="#E8D9BF">
      <rect x="132" y="330" width="5" height="34" rx="2.5"/>
      <rect x="186" y="330" width="40" height="5" rx="2.5"/>
      <rect x="186" y="384" width="40" height="5" rx="2.5"/>
      <rect x="400" y="330" width="5" height="34" rx="2.5"/>
      <rect x="570" y="330" width="5" height="34" rx="2.5"/>
    </g>
    <!-- Oven -->
    <rect x="272" y="318" width="96" height="86" rx="4" fill="#2E2620"/>
    <rect x="282" y="338" width="76" height="52" rx="3" fill="#3F3530" stroke="#5A4C3E"/>
    <rect x="284" y="324" width="72" height="4" rx="2" fill="url(#steel)"/>
    <rect x="40" y="412" width="560" height="8" fill="#4B321F"/>
  </g>

  <!-- Plant + jar decor -->
  <rect x="80" y="262" width="22" height="24" rx="4" fill="#9C6B3E"/>
  <path d="M91 262c-10-18-2-30 0-30 2 0 10 12 0 30M91 262c6-14 18-18 20-16-2 8-8 14-20 16M91 262c-8-10-20-12-22-10 2 6 10 10 22 10" fill="#6F8A5B"/>
  <rect x="120" y="266" width="16" height="20" rx="3" fill="#E9DFCD" stroke="#CDBFA7"/>
  <rect x="140" y="260" width="18" height="26" rx="3" fill="#E9DFCD" stroke="#CDBFA7"/>

  <!-- Pendant lights -->
  <g>
    <line x1="170" y1="0" x2="170" y2="18" stroke="#39303E" stroke-width="2"/>
    <path d="M156 18h28l-4 14h-20z" fill="#39303E"/>
    <line x1="470" y1="0" x2="470" y2="18" stroke="#39303E" stroke-width="2"/>
    <path d="M456 18h28l-4 14h-20z" fill="#39303E"/>
  </g>
</svg>
