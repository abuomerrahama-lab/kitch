<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-label="تركيب مفصلة هيدروليك وتعديل باب خزانة مطبخ">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3ECDF"/>
      <stop offset="1" stop-color="#E3D5BE"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A9744A"/>
      <stop offset="1" stop-color="#8A5C3A"/>
    </linearGradient>
    <linearGradient id="carcass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FBF7EE"/>
      <stop offset="1" stop-color="#E9DFCD"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4E7E9"/>
      <stop offset="1" stop-color="#9AA0A5"/>
    </linearGradient>
  </defs>
  <rect width="520" height="360" fill="url(#bg)"/>

  <!-- Cabinet carcass side -->
  <rect x="60" y="40" width="170" height="280" rx="4" fill="url(#carcass)" stroke="#CDBFA7" stroke-width="2"/>
  <line x1="60" y1="180" x2="230" y2="180" stroke="#CDBFA7" stroke-width="2"/>

  <!-- Open door -->
  <path d="M230 40l140 30v240l-140 10z" fill="url(#door)" stroke="#6E4A2E" stroke-width="2"/>
  <path d="M250 70l100 22v196l-100 8z" fill="none" stroke="#6E4A2E" stroke-width="1.4" opacity="0.6"/>

  <!-- Hinges -->
  <g>
    <rect x="196" y="78" width="46" height="18" rx="4" fill="url(#steel)" stroke="#7C8388"/>
    <circle cx="240" cy="87" r="13" fill="url(#steel)" stroke="#7C8388"/>
    <circle cx="208" cy="87" r="3" fill="#5A6065"/><circle cx="226" cy="87" r="3" fill="#5A6065"/>
    <rect x="196" y="262" width="46" height="18" rx="4" fill="url(#steel)" stroke="#7C8388"/>
    <circle cx="240" cy="271" r="13" fill="url(#steel)" stroke="#7C8388"/>
    <circle cx="208" cy="271" r="3" fill="#5A6065"/><circle cx="226" cy="271" r="3" fill="#5A6065"/>
  </g>

  <!-- Screwdriver -->
  <g transform="rotate(-28 400 200)">
    <rect x="330" y="190" width="90" height="22" rx="10" fill="#39303E"/>
    <rect x="336" y="194" width="78" height="4" rx="2" fill="#4C4152"/>
    <rect x="270" y="197" width="62" height="8" rx="2" fill="url(#steel)"/>
    <path d="M262 201l8-5v10z" fill="#9AA0A5"/>
  </g>

  <!-- Soft close badge -->
  <g transform="translate(398 250)">
    <circle r="46" fill="#39303E"/>
    <circle r="38" fill="none" stroke="#C99A66" stroke-width="2" stroke-dasharray="4 5"/>
    <path d="M-16 2l11 11 22-24" stroke="#C99A66" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
